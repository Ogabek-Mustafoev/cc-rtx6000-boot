# cc-rtx6000 boot-image build → ghcr.io (PUBLIC — faqat ochiq OSS-paketlar: cuda
# toolchain + vllm/torch/flashinfer venv'lari; kod ham, sir ham YO'Q).
# Nega: RunPod RTX Pro 6000 hostlarida /workspace tarmoq-FUSE va vLLM importlari har
# boot'da 8-13 daq yeydi; image hostning lokal diskiga tortiladi → boot ~3-5 daq.
name: cc-boot-image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/cc-boot-image.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Runner diskini bo'shatish: image ~14GB, default runner'da joy tor.
      - name: Free disk space (maksimal — base-image 20GB + toolchain + venv 13GB sig'ishi uchun)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/lib/jvm /usr/share/miniconda /usr/local/.ghcup /opt/az \
            /usr/lib/google-cloud-sdk /opt/microsoft /opt/pipx /usr/lib/firefox \
            "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af
          sudo apt-get clean
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ogabek-mustafoev/cc-rtx6000-boot:v1
            ghcr.io/ogabek-mustafoev/cc-rtx6000-boot:latest
